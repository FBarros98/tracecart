name: tracecart

x-service-healthcheck: &service-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

# OpenTelemetry zero-code instrumentation (`opentelemetry-instrument` in the Dockerfiles).
# Read by the OTel SDK itself, not by app/core/config.py. Each service adds OTEL_SERVICE_NAME and
# OTEL_RESOURCE_ATTRIBUTES (container.name becomes the container_name tag in Datadog; the host stays
# the collector's, since containers are not hosts).
x-otel-environment: &otel-environment
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  # The logging instrumentation adds an OTel handler to the root logger and keeps it across the
  # basicConfig(force=True) in core/logging.py, so logs go both to stdout and to the collector.
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tracecart-otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_TRACES_SAMPLER: parentbased_always_on
  # Health checks run every 10s; tracing them would only add noise.
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "health/.*"
  # SQLAlchemy instrumentation already traces every query; psycopg would duplicate the spans.
  OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: psycopg

services:
  tracecart-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Read by the collector's docker_stats receiver: service.version and deployment.environment.name
    # of the container metrics (service.name comes from the Compose service label).
    labels:
      tracecart.service.version: "16"
      tracecart.environment: ${ENVIRONMENT:-local}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      POSTGRES_DB: postgres
      ORDER_DB_USER: ${ORDER_DB_USER:-tracecart_order}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-tracecart_payment}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    volumes:
      - tracecart-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    # No published ports: PostgreSQL is reachable only inside the Compose network.
    networks:
      - tracecart-network
    healthcheck:
      # TCP check: during first-time initialization the server only listens on the Unix socket,
      # so this succeeds only after the init scripts have created both databases.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d tracecart_payments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tracecart-cribl:
    image: cribl/cribl:${CRIBL_VERSION:-4.20.4}
    restart: unless-stopped
    hostname: tracecart-cribl
    ports:
      # UI only; the OTLP Source (4317) is reached by the collector through the Compose network.
      - "${CRIBL_UI_PORT:-9000}:9000"
    volumes:
      - tracecart-cribl-data:/opt/cribl/local
    networks:
      - tracecart-network

  tracecart-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    # Read by the collector's docker_stats receiver: service.version and deployment.environment.name
    # of the container metrics (service.name comes from the Compose service label).
    labels:
      tracecart.service.version: "0.162.0"
      tracecart.environment: ${ENVIRONMENT:-local}
    # Stable host name (otherwise it would be the random container id).
    hostname: tracecart-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Root is needed to read the Docker socket (the image runs as uid 10001). The socket grants
    # control of the whole Docker daemon even when mounted :ro; acceptable for this local lab only.
    user: "0"
    environment:
      CRIBL_OTLP_ENDPOINT: ${CRIBL_OTLP_ENDPOINT:-tracecart-cribl:4317}
      CRIBL_AUTH_TOKEN: ${CRIBL_AUTH_TOKEN:-}
    depends_on:
      tracecart-cribl:
        condition: service_started
    volumes:
      - ./infrastructure/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Source of the docker_stats receiver (container CPU, memory, network, block I/O).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No published ports: the services reach OTLP (4317/4318) through the Compose network.
    # The image is distroless (no shell/curl), so there is no Compose healthcheck.
    networks:
      - tracecart-network

  tracecart-payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: tracecart-payment-service:local
    restart: unless-stopped
    # Read by the collector's docker_stats receiver: service.version and deployment.environment.name
    # of the container metrics (service.name comes from the Compose service label).
    labels:
      tracecart.service.version: "${PAYMENT_SERVICE_VERSION:-1.0.0}"
      tracecart.environment: ${ENVIRONMENT:-local}
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: tracecart-payment-service
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${ENVIRONMENT:-local},service.version=${PAYMENT_SERVICE_VERSION:-1.0.0},container.name=tracecart-payment-service
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: tracecart-postgres
      DB_PORT: 5432
      DB_NAME: tracecart_payments
      DB_USER: ${PAYMENT_DB_USER:-tracecart_payment}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      PAYMENT_DECLINE_ENABLED: ${PAYMENT_DECLINE_ENABLED:-false}
      PAYMENT_DECLINE_RATE: ${PAYMENT_DECLINE_RATE:-0.0}
      PAYMENT_LATENCY_ENABLED: ${PAYMENT_LATENCY_ENABLED:-false}
      PAYMENT_LATENCY_MIN_MS: ${PAYMENT_LATENCY_MIN_MS:-0}
      PAYMENT_LATENCY_MAX_MS: ${PAYMENT_LATENCY_MAX_MS:-0}
      DATABASE_FAILURE_ENABLED: ${DATABASE_FAILURE_ENABLED:-false}
      DATABASE_FAILURE_RATE: ${DATABASE_FAILURE_RATE:-0.0}
      UNEXPECTED_ERROR_ENABLED: ${UNEXPECTED_ERROR_ENABLED:-false}
      UNEXPECTED_ERROR_RATE: ${UNEXPECTED_ERROR_RATE:-0.0}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8001}:8000"
    depends_on:
      tracecart-postgres:
        condition: service_healthy
      tracecart-otel-collector:
        condition: service_started
    networks:
      - tracecart-network
    healthcheck: *service-healthcheck
    stop_grace_period: 30s

  tracecart-order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: tracecart-order-service:local
    restart: unless-stopped
    # Read by the collector's docker_stats receiver: service.version and deployment.environment.name
    # of the container metrics (service.name comes from the Compose service label).
    labels:
      tracecart.service.version: "${ORDER_SERVICE_VERSION:-1.0.0}"
      tracecart.environment: ${ENVIRONMENT:-local}
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: tracecart-order-service
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${ENVIRONMENT:-local},service.version=${ORDER_SERVICE_VERSION:-1.0.0},container.name=tracecart-order-service
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: tracecart-postgres
      DB_PORT: 5432
      DB_NAME: tracecart_orders
      DB_USER: ${ORDER_DB_USER:-tracecart_order}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://tracecart-payment-service:8000}
      PAYMENT_SERVICE_TIMEOUT_SECONDS: ${PAYMENT_SERVICE_TIMEOUT_SECONDS:-5}
    ports:
      - "${ORDER_SERVICE_PORT:-8000}:8000"
    depends_on:
      tracecart-postgres:
        condition: service_healthy
      tracecart-otel-collector:
        condition: service_started
      tracecart-payment-service:
        condition: service_healthy
    networks:
      - tracecart-network
    healthcheck: *service-healthcheck
    stop_grace_period: 30s

networks:
  tracecart-network:
    name: tracecart-network

volumes:
  tracecart-postgres-data:
    name: tracecart-postgres-data
  tracecart-cribl-data:
    name: tracecart-cribl-data
